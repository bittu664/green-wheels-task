global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: lease-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: lease-projector
    static_configs:
      - targets: ["projector:9100"]
  - job_name: lease-evaluator
    static_configs:
      - targets: ["evaluator:9100"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: lease-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
      target: ["http://api:8000/health"]
    static_configs:
      - targets: ["blackbox:9115"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
