global:
  slack_api_url_file: /etc/alertmanager/slack-webhook

route:
  receiver: fleet-ops-alerts
  group_by: [service, alertname, environment]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - receiver: fleet-ops-alerts
      matchers: ['severity="critical"']

receivers:
  - name: fleet-ops-alerts
    slack_configs:
      - channel: "#all-green-wheel-test"
        send_resolved: true
        text: '{{ range .Alerts }}{{ .Annotations.description }} {{ .Annotations.runbook_url }}{{ "\n" }}{{ end }}'