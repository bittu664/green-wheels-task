name: Lease reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      LEASE_IMAGE: greenwheels-lease:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && python -m pytest tests/test_unit.py
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check && terraform init -backend=false && terraform validate
        working-directory: terraform
      - name: Validate monitoring configs
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.4.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/monitoring:/config:ro" --entrypoint /bin/amtool prom/alertmanager:v0.28.1 check-config /config/alertmanager.yml
      - run: docker compose build api
      - run: docker compose up -d --wait db
      - run: python scripts/health-gate.py
      - run: docker compose up -d --no-build publisher projector evaluator
      - run: LEASE_TEST_URL=http://127.0.0.1:8000 python -m pytest tests/test_integration.py
      - uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Push the image that passed the health gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          target="$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          docker tag "$LEASE_IMAGE" "$target"
          docker push "$target"
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
